<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>range-player dev</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
      h1 { margin: 0; font-size: 16px; }
      #rqbit-status { color: #999; font-size: 12px; }
      #rqbit-status::before { content: '●'; margin-right: 4px; color: #888; }
      #rqbit-status[data-state='connected']::before { color: #4caf50; }
      #rqbit-status[data-state='error']::before { color: #f44336; }
      form { display: flex; flex: 1; gap: 8px; min-width: 260px; }
      input[type='text'] { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #444; border-radius: 6px; background: #1c1c1c; color: inherit; }
      button, label.file { padding: 6px 12px; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: inherit; font: inherit; cursor: pointer; }
      label.file input { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>range-player</h1>
        <span id="rqbit-status" data-state="checking">connecting…</span>
        <form id="open">
          <input id="input" type="text" placeholder="magnet link, info hash or .torrent URL" autocomplete="off" />
          <button type="submit">Open</button>
          <label class="file">.torrent<input id="file" type="file" accept=".torrent,application/x-bittorrent" /></label>
          <button id="close" type="button">Close</button>
        </form>
      </header>
      <div id="player"></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
